[project]
name = "cancasexl-linux-tests"
version = "0.5.34"
description = "Hardware tests and development support for the CANcase XL Linux driver"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
usb = ["pyusb>=1.2"]

[tool.setuptools.packages.find]
where = ["src"]
